name: HVCI Drivers Check

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-hvci-drivers:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Microsoft Vulnerable Driver Blocklist
      id: download-blocklist
      shell: powershell
      run: |
        $blocklistUrl = "https://aka.ms/VulnerableDriverBlockList"
        $zipPath = "VulnerableDriverBlockList.zip"
        $extractPath = "blocklist_temp"

        try {
          # Download with retry
          $maxRetries = 3
          $retryCount = 0
          $downloadSuccess = $false

          while ($retryCount -lt $maxRetries -and -not $downloadSuccess) {
            try {
              Write-Host "Downloading blocklist ZIP (attempt $($retryCount + 1)/$maxRetries)..."
              $webClient = New-Object System.Net.WebClient
              $webClient.Headers.Add("User-Agent", "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
              $webClient.DownloadFile($blocklistUrl, $zipPath)
              $webClient.Dispose()

              if ((Test-Path $zipPath) -and ((Get-Item $zipPath).Length -gt 0)) {
                Write-Host "Downloaded blocklist ZIP successfully"
                $downloadSuccess = $true
              } else {
                throw "Downloaded file is empty or missing"
              }
            } catch {
              $retryCount++
              Write-Host "Download attempt failed: $_"
              if ($retryCount -lt $maxRetries) {
                Write-Host "Retrying in 5 seconds..."
                Start-Sleep -Seconds 5
              }
              if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
            }
          }

          if (-not $downloadSuccess) {
            throw "Failed to download blocklist after $maxRetries attempts"
          }

          # Check hash for change detection
          $downloadHash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          Write-Host "Downloaded ZIP hash: $downloadHash"

          if (Test-Path "data/blocklist-hash.txt") {
            $storedHash = (Get-Content "data/blocklist-hash.txt" -Raw).Trim()
            if ($downloadHash -eq $storedHash) {
              Write-Host "Hash matches stored hash. Skipping processing."
              "skip_processing=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              exit 0
            } else {
              Write-Host "Hash differs. Continuing processing."
              "skip_processing=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          } else {
            Write-Host "No stored hash found. Continuing processing."
            "skip_processing=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          # Extract ZIP
          try {
            Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
            Write-Host "ZIP extracted successfully"
          } catch {
            Write-Host "PowerShell extraction failed, trying .NET fallback..."
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            if (Test-Path $extractPath) { Remove-Item $extractPath -Recurse -Force }
            New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
            [System.IO.Compression.ZipFile]::ExtractToDirectory($zipPath, $extractPath)
            Write-Host "Fallback extraction successful"
          }

          # Find the XML policy. Microsoft has shipped this package with different
          # XML names over time, so prefer the modern policy and fall back to legacy.
          $candidateNames = @(
            "SiPolicy_Enforced.xml",
            "DriverPolicy_Enforced.xml",
            "SiPolicy_Enforced_LegacyFormat.xml",
            "DriverPolicy_Enforced_LegacyFormat.xml"
          )

          $xmlPath = $null
          foreach ($candidateName in $candidateNames) {
            $xmlFile = Get-ChildItem -Path $extractPath -Recurse -File -Filter $candidateName | Select-Object -First 1
            if ($xmlFile) {
              $xmlPath = $xmlFile.FullName
              Write-Host "Found blocklist XML policy '$candidateName' at: $xmlPath"
              break
            }
          }

          if (-not $xmlPath) {
            Write-Host "Available files:"
            Get-ChildItem -Path $extractPath -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "No supported blocklist XML policy found. Expected one of: $($candidateNames -join ', ')"
            exit 1
          }

          "xml_path=$xmlPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Store new hash
          $downloadHash | Out-File -FilePath "data/blocklist-hash.txt" -Encoding utf8 -NoNewline

        } catch {
          Write-Error "Failed to download or process blocklist: $_"
          exit 1
        }

    - name: Process HVCI Driver Check
      if: env.skip_processing == 'false'
      shell: powershell
      run: |
        if (-not (Test-Path "data/drv.json")) {
          Write-Error "data/drv.json not found"
          exit 1
        }

        # Load drivers JSON
        $jsonContent = (Get-Content "data/drv.json" -Raw).Trim()
        try {
          $driversData = $jsonContent | ConvertFrom-Json
        } catch {
          Write-Host "JSON conversion failed, attempting to fix duplicate keys..."
          # Windows PowerShell 5.1 ConvertFrom-Json treats object keys as
          # case-insensitive, while drv.json can contain PE section names that
          # differ only by case (for example INIT/init and PAGE/page).
          $jsonContent = $jsonContent -creplace '"init"\s*:', '"init_lowercase":'
          $jsonContent = $jsonContent -creplace '"page"\s*:', '"page_lowercase":'
          $driversData = $jsonContent | ConvertFrom-Json
        }

        Write-Host "Loaded $($driversData.Count) drivers from data/drv.json"

        # Load XML policy
        $xmlPath = $env:xml_path
        if (-not (Test-Path $xmlPath)) {
          Write-Error "XML policy file not found: $xmlPath"
          exit 1
        }

        [xml]$policy = Get-Content $xmlPath
        $fileRules = $policy.SiPolicy.FileRules
        $signers = $policy.SiPolicy.Signers.Signer

        Write-Host "Found $($fileRules.Deny.Count) deny rules and $($signers.Count) signers"

        $allowed = New-Object System.Collections.ArrayList
        $blocked = New-Object System.Collections.ArrayList

        function Test-BlockedHash($driver) {
          foreach ($hash in $fileRules.Deny.Hash) {
            if ($hash -and (
              ($hash -eq $driver.Authentihash.SHA256) -or
              ($hash -eq $driver.Authentihash.SHA1) -or
              ($hash -eq $driver.Authentihash.MD5) -or
              ($hash -eq $driver.SHA256) -or
              ($hash -eq $driver.SHA1) -or
              ($hash -eq $driver.MD5)
            )) {
              return $true
            }
          }
          return $false
        }

        function Test-BlockedSigner($driver) {
          $fileAttrib = $fileRules.FileAttrib | Where-Object { $_.FileName -eq $driver.OriginalFilename }

          foreach ($signer in $signers) {
            if ($signer.CertRoot -and $signer.CertRoot.Value) {
              $tbs = $signer.CertRoot.Value.ToLower()

              if ($driver.Signatures -and $driver.Signatures.Count -gt 0) {
                foreach ($signature in $driver.Signatures) {
                  if ($signature.Certificates -and $signature.Certificates.Count -gt 0) {
                    foreach ($cert in $signature.Certificates) {
                      if ($cert.TBS -and (
                        ($cert.TBS.MD5 -and $cert.TBS.MD5.ToLower() -eq $tbs) -or
                        ($cert.TBS.SHA1 -and $cert.TBS.SHA1.ToLower() -eq $tbs) -or
                        ($cert.TBS.SHA256 -and $cert.TBS.SHA256.ToLower() -eq $tbs) -or
                        ($cert.TBS.SHA384 -and $cert.TBS.SHA384.ToLower() -eq $tbs)
                      )) {
                        $blockedFiles = $signer.FileAttribRef
                        if (-not $blockedFiles -or ($fileAttrib -and $blockedFiles.RuleID -contains $fileAttrib.ID)) {
                          return $true
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          return $false
        }

        # Process each driver sample
        foreach ($driver in $driversData) {
          if ($driver.KnownVulnerableSamples -and $driver.KnownVulnerableSamples.Count -gt 0) {
            foreach ($sample in $driver.KnownVulnerableSamples) {
              $isBlocked = $false

              if (Test-BlockedHash $sample) {
                $isBlocked = $true
              }

              # Check file version rules
              if (-not $isBlocked) {
                $fileMaxVersion = ($fileRules.Deny | Where-Object { $_.FileName -eq $sample.OriginalFilename }).MaximumFileVersion
                if ($fileMaxVersion -and $sample.FileVersion) {
                  try {
                    $version = ($sample.FileVersion -replace ',\s*', '.').Split()[0]
                    if ($version -and [version]$version -le [version]$fileMaxVersion) {
                      $isBlocked = $true
                    }
                  } catch {
                    Write-Host "Warning: Could not parse version '$($sample.FileVersion)' for $($sample.OriginalFilename)"
                  }
                }
              }

              # Check signer rules
              if (-not $isBlocked) {
                if (Test-BlockedSigner $sample) {
                  $isBlocked = $true
                }
              }

              $driverInfo = [PSCustomObject]@{
                MD5 = $sample.MD5
                SHA1 = $sample.SHA1
                SHA256 = $sample.SHA256
                Status = if ($isBlocked) { "Blocked" } else { "Allowed" }
              }

              if ($isBlocked) {
                [void]$blocked.Add($driverInfo)
              } else {
                [void]$allowed.Add($driverInfo)
              }
            }
          }
        }

        # Generate CSV
        $allDrivers = $allowed + $blocked
        $csvPath = "data/hvci_drivers.csv"
        if (-not (Test-Path "data")) { New-Item -ItemType Directory -Path "data" -Force | Out-Null }
        $allDrivers | Export-Csv -Path $csvPath -NoTypeInformation
        Write-Host "CSV created: $($allDrivers.Count) entries ($($allowed.Count) allowed, $($blocked.Count) blocked)"

        "total_drivers=$($allDrivers.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "allowed_drivers=$($allowed.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "blocked_drivers=$($blocked.Count)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Generate Summary and Badge
      if: env.skip_processing == 'false'
      shell: powershell
      run: |
        # Job summary
        @"
        # HVCI Driver Check Results

        | Metric | Count |
        |--------|-------|
        | Total Processed | $env:total_drivers |
        | Allowed | $env:allowed_drivers |
        | Blocked | $env:blocked_drivers |

        - **Allowed** drivers can potentially load despite HVCI restrictions
        - **Blocked** drivers are prevented from loading by the HVCI policy
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

        # Badge data
        if (-not (Test-Path ".github")) { New-Item -ItemType Directory -Path ".github" -Force | Out-Null }
        @{
          schemaVersion = 1
          label = "HVCI Drivers"
          message = "Allowed: $env:allowed_drivers | Blocked: $env:blocked_drivers"
          color = if ([int]$env:allowed_drivers -gt [int]$env:blocked_drivers) { "orange" } else { "green" }
        } | ConvertTo-Json | Out-File -FilePath ".github/hvci-stats.json" -Encoding utf8

    - name: Commit and push changes
      if: env.skip_processing == 'false'
      shell: powershell
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        git add data/hvci_drivers.csv data/blocklist-hash.txt .github/hvci-stats.json

        $status = git status --porcelain
        if ($status) {
          git commit -m "Update HVCI driver check results - $env:allowed_drivers allowed, $env:blocked_drivers blocked"
          git push
          Write-Host "Changes committed and pushed"
        } else {
          Write-Host "No changes to commit"
        }

    - name: Cleanup
      if: always()
      shell: powershell
      run: |
        if (Test-Path "VulnerableDriverBlockList.zip") { Remove-Item "VulnerableDriverBlockList.zip" -Force }
        if (Test-Path "blocklist_temp") { Remove-Item "blocklist_temp" -Recurse -Force }
        Write-Host "Cleanup completed"
