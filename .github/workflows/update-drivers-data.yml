name: Update LOLDrivers Data

# Trigger on new commits to the LOLDrivers JSON file
on:
  schedule:
    - cron: '0 1 * * 1'  # Check weekly on Mondays at 01:00 UTC
  workflow_dispatch:  # Allows manual execution

permissions:
  contents: write
  actions: read
  pull-requests: write

env:
  REMOTE_URL: https://raw.githubusercontent.com/magicsword-io/LOLDrivers/refs/heads/main/loldrivers.io/content/api/drivers.json
  GITHUB_API_URL: https://api.github.com/repos/magicsword-io/LOLDrivers/commits?path=loldrivers.io/content/api/drivers.json&per_page=1
  LOCAL_FILE: data/drv.json
  BACKUP_FILE: data/drv.bak
  COMMIT_HASH_FILE: data/.last_commit_hash

jobs:
  update-drivers-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        persist-credentials: true

    - name: Check for new commits on LOLDrivers JSON file
      id: check_commits
      run: |
        echo "Checking for new commits on LOLDrivers JSON file..."

        API_URL="https://api.github.com/repos/magicsword-io/LOLDrivers/commits?path=loldrivers.io/content/api/drivers.json&per_page=1"

        # Fetch commit info (single call - reused later)
        api_response=$(curl -s -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL")

        # Validate JSON
        if ! echo "$api_response" | jq . > /dev/null 2>&1; then
          echo "Invalid JSON response from GitHub API"
          exit 1
        fi

        # Extract commit hash
        if echo "$api_response" | jq -e 'type == "array"' > /dev/null 2>&1; then
          latest_commit=$(echo "$api_response" | jq -r '.[0].sha // empty')
          commit_message=$(echo "$api_response" | jq -r '.[0].commit.message // "No message"' | head -1)
          commit_author=$(echo "$api_response" | jq -r '.[0].commit.author.name // "Unknown"')
          commit_date=$(echo "$api_response" | jq -r '.[0].commit.committer.date // "Unknown"')
        elif echo "$api_response" | jq -e 'has("sha")' > /dev/null 2>&1; then
          latest_commit=$(echo "$api_response" | jq -r '.sha // empty')
          commit_message=$(echo "$api_response" | jq -r '.commit.message // "No message"' | head -1)
          commit_author=$(echo "$api_response" | jq -r '.commit.author.name // "Unknown"')
          commit_date=$(echo "$api_response" | jq -r '.commit.committer.date // "Unknown"')
        else
          error_msg=$(echo "$api_response" | jq -r '.message // "Unknown error"')
          echo "GitHub API error: $error_msg"
          exit 1
        fi

        if [ -z "$latest_commit" ] || [ "$latest_commit" = "null" ]; then
          echo "Failed to get latest commit hash"
          exit 1
        fi

        echo "Latest commit: $latest_commit"
        echo "Author: $commit_author"
        echo "Message: $commit_message"

        # Store commit details for later steps (single API call)
        echo "latest_commit=$latest_commit" >> $GITHUB_OUTPUT
        echo "commit_message=$commit_message" >> $GITHUB_OUTPUT
        echo "commit_author=$commit_author" >> $GITHUB_OUTPUT
        echo "commit_date=$commit_date" >> $GITHUB_OUTPUT

        # Check stored hash
        if [ -f "$COMMIT_HASH_FILE" ]; then
          stored_commit=$(cat "$COMMIT_HASH_FILE")
          echo "Stored commit hash: $stored_commit"

          if [ "$latest_commit" = "$stored_commit" ]; then
            echo "No new commits detected - skipping update"
            echo "has_new_commit=false" >> $GITHUB_OUTPUT
          else
            echo "New commit detected - update needed"
            echo "has_new_commit=true" >> $GITHUB_OUTPUT
            echo "stored_commit=$stored_commit" >> $GITHUB_OUTPUT
          fi
        else
          echo "No stored commit hash - first run"
          echo "has_new_commit=true" >> $GITHUB_OUTPUT
          echo "stored_commit=none" >> $GITHUB_OUTPUT
        fi

    - name: Download and backup files
      if: steps.check_commits.outputs.has_new_commit == 'true'
      id: download
      run: |
        echo "Downloading remote drivers.json..."
        curl -s -L "$REMOTE_URL" -o temp_drivers.json

        if [ ! -f temp_drivers.json ]; then
          echo "Failed to download remote file"
          exit 1
        fi

        echo "Remote file size: $(stat -c%s temp_drivers.json) bytes"
        mkdir -p data

        # Backup existing file
        if [ -f "$LOCAL_FILE" ]; then
          echo "Backing up existing drv.json..."
          cp "$LOCAL_FILE" "$BACKUP_FILE"
          echo "backup_created=true" >> $GITHUB_OUTPUT
        else
          echo "No existing drv.json to backup"
          echo "backup_created=false" >> $GITHUB_OUTPUT
        fi

        mv temp_drivers.json "$LOCAL_FILE"
        echo "${{ steps.check_commits.outputs.latest_commit }}" > "$COMMIT_HASH_FILE"
        echo "Files updated successfully"

    - name: Commit and push changes
      if: steps.check_commits.outputs.has_new_commit == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action - LOLDrivers Updater"

        git add "$LOCAL_FILE" "$COMMIT_HASH_FILE"
        if [ "${{ steps.download.outputs.backup_created }}" = "true" ]; then
          git add "$BACKUP_FILE"
        fi

        # Reuse commit info from step 1 (no redundant API call)
        COMMIT_MSG="${{ steps.check_commits.outputs.commit_message }}"
        LATEST="${{ steps.check_commits.outputs.latest_commit }}"
        STORED="${{ steps.check_commits.outputs.stored_commit }}"
        TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

        # Build multi-line commit message via temp file
        {
          echo "Update LOLDrivers data: $COMMIT_MSG"
          echo ""
          echo "Automated update triggered by new commit in LOLDrivers repository"
          echo "Commit: $LATEST"
          echo "Previous: $STORED"
          echo "Source: $REMOTE_URL"
          echo "Timestamp: $TIMESTAMP"
        } > /tmp/commit_msg.txt

        git commit -F /tmp/commit_msg.txt
        rm -f /tmp/commit_msg.txt

        git push origin ${{ github.ref_name }}
        echo "Changes pushed successfully"

    - name: Cleanup
      if: always()
      run: rm -f temp_drivers.json

    - name: Job Summary
      if: always()
      run: |
        {
          echo "## Update LOLDrivers Data"
          echo "- **Trigger:** ${{ github.event_name }}"
          echo "- **Status:** ${{ job.status }}"
          echo "- **Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""

          if [ "${{ steps.check_commits.outputs.has_new_commit }}" = "true" ]; then
            echo "### Update Applied"
            echo "- **Commit:** \`${{ steps.check_commits.outputs.latest_commit }}\`"
            echo "- **Previous:** \`${{ steps.check_commits.outputs.stored_commit }}\`"
            echo "- **Author:** ${{ steps.check_commits.outputs.commit_author }}"
            echo "- **Message:** ${{ steps.check_commits.outputs.commit_message }}"
          else
            echo "### No Update Needed"
            echo "No new commits detected in the upstream LOLDrivers repository."
          fi

          echo ""
          echo "### Resources"
          echo "- [LOLDrivers Website](https://loldrivers.io/)"
          echo "- [Source Repository](https://github.com/magicsword-io/LOLDrivers)"
        } >> $GITHUB_STEP_SUMMARY
